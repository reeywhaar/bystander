name: publish

on:
  push:
    branches: [main]
  # So a failed publish can be retried without an empty commit.
  workflow_dispatch:

# A newer commit on main should win the race for `latest` rather than queue behind an older
# one that would overwrite it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publishing `latest` unconditionally means a broken commit becomes the image everyone
  # pulls. The tests take under a minute; the gate is worth it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: current
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Works without the frontend having been built: web/dist/.gitkeep is tracked, so the
      # //go:embed in web/embed.go resolves and the binary falls back to its placeholder
      # page. That is the whole reason the file is committed — and the whole reason
      # vite.config.ts does not empty the directory.
      - name: Test the backend
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check frontend formatting
        working-directory: web
        run: npm run format:check

      - name: Typecheck the frontend
        working-directory: web
        run: npm run typecheck

      - name: Test the frontend
        working-directory: web
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the built-in token.
      packages: write

    outputs:
      version: ${{ steps.sha.outputs.short }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Only needed for the final alpine stage's apk step, which is the one thing that runs
      # on the target architecture. The npm and Go builds are pinned to $BUILDPLATFORM and
      # cross-compile, so nothing expensive happens under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to configure: the automatic token can write packages for this repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push the reader
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.sha.outputs.short }}
          platforms: linux/amd64,linux/arm64
          # `npm ci` is the expensive stage here, and it is cached against
          # web/package-lock.json alone — an unchanged lockfile is a layer hit even when the
          # source has changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the package listing to one real platform instead of adding an
          # "unknown/unknown" attestation entry beside it.
          provenance: false

      # The Dockerfile already fails the build if an entry is empty, so this is not that
      # check. It records the version in the run log, and — more usefully — proves the
      # published image actually serves the bundle rather than the "not built" placeholder,
      # which is the one failure that would otherwise reach users looking exactly like a
      # successful publish.
      - name: Smoke-test the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          docker run --rm "$IMAGE" version

          docker run -d --name smoke \
            -e BYSTANDER_PUBLIC_URL=http://localhost:8080 \
            -p 8080:80 "$IMAGE"

          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'

          # An empty database prints an invitation to become its administrator, and that
          # link is the only way in. A first run that does not produce one is a broken
          # release however healthy the process looks.
          docker logs smoke 2>&1 | grep -q '/invite/'

          # Every island, and none of them the placeholder.
          for path in / /login /manage /admin; do
            body=$(curl -fsS -H 'Accept: text/html' "http://127.0.0.1:8080$path")
            if printf '%s' "$body" | grep -q "has not been built"; then
              echo "$path is serving the placeholder: the bundle was not embedded"
              docker logs smoke
              exit 1
            fi
            printf '%s' "$body" | grep -q '<div id="root">'
          done

          docker rm -f smoke >/dev/null

          # There is no backup port to test any more. This program posts its own archive to a
          # backup agent rather than being fetched from, so what used to be checked here — that
          # the archive is a real SQLite database, and that the route is not reachable on the
          # reader's port — is checked in Go, against a receiver the test stands up. See
          # internal/backup. A shell curl could only ever prove the weaker half.


  # A job of its own rather than steps on `publish`, because a failing `test` *skips*
  # `publish` rather than failing it, and a step in a job that never starts cannot report
  # that it never started. This one runs either way and reads the results off `needs`.
  notify:
    needs: [test, publish]
    # Not always(): cancel-in-progress means a newer push kills the run in flight, and being
    # told that a commit you just superseded was cancelled is noise.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Nothing is checked out: a composite action referenced across repositories is fetched by
    # the runner and finds its own script through github.action_path.
    permissions: {}

    # The secrets context is not available to `if`, so the presence check goes through env.
    # Without this, a repo that has not set the secrets yet gets a red run on every push —
    # a broken notifier should not look like a broken build.
    env:
      NOTIFIO_HOST: ${{ secrets.NOTIFIO_HOST }}
      NOTIFIO_TOKEN: ${{ secrets.NOTIFIO_TOKEN }}
      CONFIGURED: ${{ secrets.NOTIFIO_HOST != '' && secrets.NOTIFIO_TOKEN != '' }}

    steps:
      # A token is issued for one channel, and the channel decides where the message lands.
      - name: Notify on success
        if: ${{ env.CONFIGURED == 'true' && needs.publish.result == 'success' }}
        uses: reeywhaar/notifio/ghactions/notify@main
        with:
          host: ${{ env.NOTIFIO_HOST }}
          token: ${{ env.NOTIFIO_TOKEN }}
          subject: "${{ github.repository }} published"
          body-type: md
          body: |
            📰 Published `ghcr.io/${{ github.repository }}:latest`

            - version `${{ needs.publish.outputs.version }}` by ${{ github.actor }}
            - [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

      - name: Notify on failure
        if: ${{ env.CONFIGURED == 'true' && needs.publish.result != 'success' }}
        uses: reeywhaar/notifio/ghactions/notify@main
        with:
          host: ${{ env.NOTIFIO_HOST }}
          token: ${{ env.NOTIFIO_TOKEN }}
          # Which half broke is the first thing worth knowing: a failing test means the
          # commit is bad, a failing publish means the commit is fine and the build is not.
          subject: "${{ github.repository }} ${{ needs.test.result != 'success' && 'tests failed' || 'publish failed' }}"
          body-type: md
          body: |
            ❌ ${{ needs.test.result != 'success' && 'Tests failed' || 'Publish failed' }}, by ${{ github.actor }}

            - [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - [view the run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
